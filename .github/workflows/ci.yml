name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  attestations: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build verified skill
        run: ./scripts/build-skill.sh

      - name: Round-trip test packaged skill
        run: ./scripts/test-skill.sh

      - name: Upload skill artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill
          path: |
            dist/skill.zip
            dist/skill.zip.sha256
            dist/BUILD-INFO.txt
          if-no-files-found: error
