name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build verified skill
        run: ./scripts/build-skill.sh

      - name: Round-trip test packaged skill
        run: ./scripts/test-skill.sh

      - name: Attest skill build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/skill.zip

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/skill.zip
            dist/skill.zip.sha256
            dist/BUILD-INFO.txt
            dist/upstream/upstream-release-verification.json
            dist/upstream/upstream-release-archive-verification.json
            dist/upstream/upstream-release-checksum-verification.json
            dist/upstream/upstream-archive.sha256
          )
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
